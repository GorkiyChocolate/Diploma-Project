schema_version: 1
name: mysql
description: MySQL relational database
default_version: "8.4"

versions:
  "8.4":
    image: mysql:8.4
  "9":
    image: mysql:9
  "26":
    image: mysql:26

defaults:
  ports:
    - "3306:3306"
  environment:
    - "MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}"
    - "MYSQL_DATABASE=${MYSQL_DATABASE:-app}"
  volumes:
    - "mysql_data:/var/lib/mysql"
  restart: unless-stopped
