
schema_version: 1
name: kafka
description: Apache Kafka single-node KRaft broker
default_version: "4.3.1"

versions:
  "4.2.2":
    image: apache/kafka:4.2.2
  "4.3.1":
    image: apache/kafka:4.3.1
  "4.4.0":
    image: apache/kafka:4.4.0

defaults:
  ports:
    - "9092:9092"
  environment:
    - "KAFKA_NODE_ID=1"
    - "KAFKA_PROCESS_ROLES=broker,controller"
    - "KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:29093"
    - "KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER"
    - "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
    - "KAFKA_LISTENERS=CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092"
    - "KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092"
    - "KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT"
    - "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1"
    - "KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1"
    - "KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1"
    - "KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0"
    - "KAFKA_LOG_DIRS=/var/lib/kafka/data"
    - "CLUSTER_ID=${KAFKA_CLUSTER_ID:?Set KAFKA_CLUSTER_ID}"
  volumes:
    - "kafka_data:/var/lib/kafka/data"
  restart: unless-stopped
