
schema_version: 1
name: ec2
description: LocalStack AWS service emulator for local development
default_version: "2026.10.4"

versions:
  "2026.10.2":
    image: localstack/localstack:2026.10.2
  "2026.10.3":
    image: localstack/localstack:2026.10.3
  "2026.10.4":
    image: localstack/localstack:2026.10.4

defaults:
  ports:
    - "127.0.0.1:4566:4566"

  environment:
    - "LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?Set LOCALSTACK_AUTH_TOKEN}"
    - "DEBUG=0"

  volumes:
    - "localstack_data:/var/lib/localstack"

  restart: unless-stopped
